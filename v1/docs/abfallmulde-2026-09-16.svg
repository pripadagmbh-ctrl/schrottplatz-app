<text x="44" y="652" font-size="11" font-family="sans-serif" fill="#444">Grundriss, Norden oben. Grün = Schwenkband 5,80–9,20 m; innen gestrichelt die 5,80 m, darunter bekommt der Arm den Ausleger nicht mehr zusammen.</text>
<text x="44" y="668" font-size="11" font-family="sans-serif" fill="#444">Im Band stehen heute zwei Sortierziele: BUNT + VA und MUELL. Die rot gestrichelte Tasche ist der einzige Platz, an dem eine gleich große zweite Mulde noch stünde.</text>
