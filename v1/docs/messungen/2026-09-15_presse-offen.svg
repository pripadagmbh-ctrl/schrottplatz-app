<svg xmlns="http://www.w3.org/2000/svg" width="633" height="700" viewBox="0 0 633 700">
<rect width="100%" height="100%" fill="#f7f5f0"/>
<text x="30.0" y="28.0" font-family="Segoe UI,Arial" font-size="18" fill="#111" text-anchor="start">Presse: W&#228;nde ja, Deckel nein &#8212; 15.09.2026 (E-029)</text>
<text x="30.0" y="49.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">Das fertige Paket war nicht herauszubekommen: Die Presse stand als voller Klotz in der</text>
<text x="30.0" y="65.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">Hindernisliste, 2,20 m hoch &#252;ber die GANZE Kammer. Jetzt sperrt nur noch der Wandring.</text>
<text x="30.0" y="83.0" font-family="Segoe UI,Arial" font-size="10" fill="#888" text-anchor="start">Ma&#223;e in Metern &#183; Norden oben &#183; rot gestrichelt = alter Eintrag</text>
<rect x="206.8" y="187.3" width="218.5" height="225.4" fill="#f2d5d5" stroke="#b44" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="316.0" y="179.3" font-family="Segoe UI,Arial" font-size="9" fill="#b44" text-anchor="middle">VORHER: ein Rechteck 4,75 &#215; 4,90 m, top 2,20 m &#8212; alles darunter gesperrt</text>
<rect x="222.8" y="187.3" width="186.3" height="16.1" fill="#6f6480" stroke="#3d3450" stroke-width="1.4"/>
<rect x="222.8" y="396.6" width="186.3" height="16.1" fill="#6f6480" stroke="#3d3450" stroke-width="1.4"/>
<rect x="206.8" y="187.3" width="16.1" height="225.4" fill="#6f6480" stroke="#3d3450" stroke-width="1.4"/>
<rect x="409.2" y="187.3" width="16.1" height="225.4" fill="#6f6480" stroke="#3d3450" stroke-width="1.4"/>
<rect x="222.8" y="203.4" width="186.3" height="193.2" fill="#e7e2ef" stroke="#6f6480" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="316.0" y="228.7" font-family="Segoe UI,Arial" font-size="11" fill="#41365a" text-anchor="middle">KAMMER OFFEN</text>
<text x="316.0" y="242.5" font-family="Segoe UI,Arial" font-size="9.5" fill="#41365a" text-anchor="middle">lichte 4,05 &#215; 4,20 m</text>
<rect x="234.3" y="214.9" width="163.3" height="170.2" fill="none" stroke="#2f6b45" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="316.0" y="266.9" font-family="Segoe UI,Arial" font-size="9" fill="#2f6b45" text-anchor="middle">Tastfenster Spinne 3,55 &#215; 3,70 m</text>
<circle cx="316.0" cy="300.0" r="77.7" fill="none" stroke="#2f6b45" stroke-width="1.6"/>
<text x="316.0" y="304.0" font-family="Segoe UI,Arial" font-size="9.5" fill="#1f4a30" text-anchor="middle">SPINNE offen 3,38 m</text>
<rect x="278.1" y="286.2" width="75.9" height="27.6" fill="#c8b48a" stroke="#8a7440" stroke-width="1.3"/>
<text x="316.0" y="323.9" font-family="Segoe UI,Arial" font-size="8.5" fill="#5c4a20" text-anchor="middle">PAKET 7,40&#8211;9,15 m vom Sitz</text>
<polyline points="222.8,373.6 238.3,373.6" fill="none" stroke="#b44" stroke-width="1.2"/>
<text x="230.6" y="368.6" font-family="Segoe UI,Arial" font-size="8" fill="#b44" text-anchor="middle">0,34</text>
<polyline points="393.7,373.6 409.2,373.6" fill="none" stroke="#b44" stroke-width="1.2"/>
<text x="401.4" y="368.6" font-family="Segoe UI,Arial" font-size="8" fill="#b44" text-anchor="middle">0,34</text>
<polyline points="378.1,222.3 378.1,203.4" fill="none" stroke="#b44" stroke-width="1.2"/>
<text x="400.1" y="212.6" font-family="Segoe UI,Arial" font-size="8" fill="#b44" text-anchor="middle">0,41</text>
<polyline points="206.8,300.0 138.9,300.0" fill="none" stroke="#8b7bb0" stroke-width="2.0" stroke-dasharray="5 3"/>
<text x="168.8" y="292.0" font-family="Segoe UI,Arial" font-size="9" fill="#8b7bb0" text-anchor="middle">Deckelklappe 3,85 m nach Westen</text>
<polyline points="435.6,166.6 481.6,139.0" fill="none" stroke="#c07b2a" stroke-width="2.0"/>
<text x="487.6" y="133.0" font-family="Segoe UI,Arial" font-size="9.5" fill="#c07b2a" text-anchor="start">zum Sitz (8,28 m)</text>
<text x="30.0" y="608.0" font-family="Segoe UI,Arial" font-size="12.5" fill="#222" text-anchor="start">WAS SICH &#196;NDERT</text>
<text x="30.0" y="632.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#555" text-anchor="start">Vier Wandeintr&#228;ge statt einem Vollrechteck &#8212; aus derselben Rechnung wie die Rapier-Kollider.</text>
<text x="30.0" y="649.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#555" text-anchor="start">Der Greifer kommt auf den Kammerboden und das Paket wieder heraus; gepr&#252;ft wird der ganze Weg.</text>
<text x="30.0" y="666.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#555" text-anchor="start">F&#252;r Fahrzeuge bleibt sie zu: Ein LKW ist 8,04 m lang, die Kammer 4,20 m &#8212; er ragt immer &#252;ber eine Wand.</text>
<text x="30.0" y="683.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#555" text-anchor="start">Offen: Bei geschlossener Deckelklappe h&#228;lt die Liste den Greifer nicht mehr auf (die Klappe ist kinematisch).</text>
</svg>