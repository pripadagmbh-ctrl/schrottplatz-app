<text x="288.5" y="384.8" font-family="Segoe UI,Arial" font-size="9.5" fill="#b03a2e" text-anchor="start">0,35 m</text>
<polyline points="371.0,204.8 407.3,204.8" fill="none" stroke="#b03a2e" stroke-width="2.2"/>
<text x="388.5" y="191.0" font-family="Segoe UI,Arial" font-size="9.5" fill="#b03a2e" text-anchor="middle">1,45 m</text>
<text x="288.5" y="359.8" font-family="Segoe UI,Arial" font-size="9.5" fill="#8a5310" text-anchor="start">← Sockel, 2 Lagen = 1,00 m</text>
<text x="288.5" y="342.3" font-family="Segoe UI,Arial" font-size="9.5" fill="#3f6b3a" text-anchor="start">offen zum Bagger</text>
<circle cx="383.5" cy="448.5" r="9" fill="#c07b2a"/>
<polyline points="383.5,448.5 383.5,383.5" fill="none" stroke="#c07b2a" stroke-width="3"/>
<text x="397.5" y="452.5" font-family="Segoe UI,Arial" font-size="10" fill="#8a5310" text-anchor="start">BAGGER (−0,5 | −22,5)</text>
<text x="397.5" y="465.5" font-family="Segoe UI,Arial" font-size="10" fill="#8a5310" text-anchor="start">Blick nach Norden</text>
<text x="26.0" y="685.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#444" text-anchor="start">SOCKEL: zwei Lagen Betonlego = 1,00 m. Vom Fahrersitz bleiben dann 48 % (vorn) bis 21 % (hinten) des Muldenbodens sichtbar;</text>
<text x="26.0" y="702.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#444" text-anchor="start">über einer Lage waren es 79 bis 68 %. Die Mulde ist zum Bagger hin offen — über dem Sockel steht nichts.</text>
<text x="26.0" y="719.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#444" text-anchor="start">MUELL-CONTAINER: kein fester Behälter mehr. Er steht morgens hier und danach dort, wo der Spieler ihn absetzt. Leer 1781 kg,</text>
<text x="26.0" y="736.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#444" text-anchor="start">also gerade noch zu heben. Nachts wandert sein Inhalt ins ABFALL-Silo, die leere Hülle bleibt stehen. Er ist nichts wert.</text>
<text x="26.0" y="753.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#444" text-anchor="start">Er ist 4,30 m lang — einen Dezimeter länger als die Presskammer (4,20 m). In die Presse passt er nicht.</text>
<text x="26.0" y="774.0" font-family="Segoe UI,Arial" font-size="9.5" fill="#999" text-anchor="start">Im Plan ist +x rechts; aus dem Fahrersitz ist das LINKS. Der Bagger schaut nach oben ins Bild.</text>
</svg>