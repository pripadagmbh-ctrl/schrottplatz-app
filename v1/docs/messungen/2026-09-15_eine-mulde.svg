<svg xmlns="http://www.w3.org/2000/svg" width="630" height="779" viewBox="0 0 630 779">
<defs><marker id="pf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#3f6b3a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f5f0"/>
<text x="26.0" y="28.0" font-family="Segoe UI,Arial" font-size="17" fill="#111" text-anchor="start">Rust'n'Reibach — eine Mulde neben der Presse, 15.09.2026 (E-034)</text>
<text x="26.0" y="50.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">1  Alle Mulden rechts vom Bagger abgerissen — übrig bleibt EINE</text>
<text x="26.0" y="66.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">2  Sie rückt an die Presse, ihr Sockel wird zwei Lagen hoch (1,00 m)</text>
<text x="26.0" y="82.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">3  Der Müll wird ein Container, den der Spieler hinstellt, wo er will</text>
<text x="26.0" y="101.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#888" text-anchor="start">Maße in Metern · Norden oben · rot gestrichelt = Stand vom Vormittag</text>
<rect x="407.3" y="116.0" width="77.5" height="121.3" fill="#e9e5da" stroke="none" stroke-width="0"/>
<text x="446.0" y="141.0" font-family="Segoe UI,Arial" font-size="9" fill="#9a917f" text-anchor="middle">KIPPERSPUR</text>
