<text x="26.0" y="28.0" font-family="Segoe UI,Arial" font-size="17" fill="#111" text-anchor="start">Rust'n'Reibach — eine Mulde neben der Presse, 15.09.2026 (E-034, Nachtrag E-041)</text>
<text x="26.0" y="50.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">1  Alle Mulden rechts vom Bagger abgerissen — übrig bleibt EINE</text>
<text x="26.0" y="66.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">2  Sie rückt an die Presse, ihr Sockel wird zwei Lagen hoch (1,00 m)</text>
<text x="26.0" y="82.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#555" text-anchor="start">3  Der Müll wird ein Container, den der Spieler hinstellt, wo er will</text>
<text x="26.0" y="98.0" font-family="Segoe UI,Arial" font-size="11.5" fill="#2e5f86" text-anchor="start">4  E-041: sein Startplatz rückt neben die Mulde und aus der Fahrlinie</text>
<text x="26.0" y="115.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#888" text-anchor="start">Maße in Metern · Norden oben · rot gestrichelt = Stand vom Vormittag</text>
<rect x="407.3" y="116.0" width="77.5" height="121.3" fill="#e9e5da" stroke="none" stroke-width="0"/>
