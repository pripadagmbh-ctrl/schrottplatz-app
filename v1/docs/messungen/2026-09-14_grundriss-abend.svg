ill="#5b626b" text-anchor="end">Schwenk</text><line x1="704" y1="148" x2="1200" y2="148" stroke="#c8ccd2"/><text x="704.0" y="170.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">MISCHSCHROTT</text><text x="1010.0" y="170.0" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#2c7a66" text-anchor="end">7,91 m</text><text x="1200.0" y="170.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="end">145°</text><text x="704.0" y="192.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">STAHLSCHROTT</text><text x="1010.0" y="192.0" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#2c7a66" text-anchor="end">6,96 m</text><text x="1200.0" y="192.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="end">201°</text><text x="704.0" y="214.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">PRESSE</text><text x="1010.0" y="214.0" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#2c7a66" text-anchor="end">8,28 m</text><text x="1200.0" y="214.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="end">245°</text><text x="704.0" y="236.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">MUELL</text><text x="1010.0" y="236.0" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#2c7a66" text-anchor="end">8,75 m</text><text x="1200.0" y="236.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="end">121°</text><text x="704.0" y="258.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">LKW</text><text x="1010.0" y="258.0" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#2c7a66" text-anchor="end">6,91 m</text><text x="1200.0" y="258.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="end">80°</text><text x="704.0" y="294.0" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1b2026" text-anchor="start">Was sich geändert hat</text><text x="704.0" y="316.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">LKW-Abladeplatz auf die alte Pressenstelle,</text><text x="704.0" y="335.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">der Wagen steht mit der Längsseite zum Sitz.</text><text x="704.0" y="354.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Alle vier Ecken der Ladefläche liegen zwischen</text><text x="704.0" y="373.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">5,65 und 9,04 m — vorher 8,0 bis 13,5 m radial.</text><text x="704.0" y="392.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start"></text><text x="704.0" y="411.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Presse an die Westflanke, um 90° gedreht,</text><text x="704.0" y="430.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Kammer 4,20 × 4,05 m statt 5,95 × 4,05.</text><text x="704.0" y="449.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start"></text><text x="704.0" y="468.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Ausbuchtung 6,5 m statt 9,5 m tief:</text><text x="704.0" y="487.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">40,8 statt 61,2 m² Haldenfläche je Halde.</text><text x="704.0" y="506.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start"></text><text x="704.0" y="525.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Reifencontainer ersatzlos weg — Reifen zählen</text><text x="704.0" y="544.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">vorerst zum Müll (mitFraktionen).</text><text x="704.0" y="563.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start"></text><text x="704.0" y="582.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">Metallmulden: ALU+ZINK 7,28 m im Band,</text><text x="704.0" y="601.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">KABEL 9,17 m am Rand, KUPFER+MSG 12,31 m</text><text x="704.0" y="620.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">außerhalb. Entscheidung offen.</text></svg>