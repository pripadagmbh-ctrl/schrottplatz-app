<text x="30" y="852" font-family="Segoe UI,Arial" font-size="12.5" fill="#222">WAS SICH &#196;NDERT</text>
<text x="30" y="874" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">Kipper h&#228;lt jetzt am Abladeplatz (6,3 | &#8722;23,0), mit der L&#228;ngsseite zum Sitz &#8212; wie die Pritschen.</text>
<text x="30" y="891" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">Er kippt r&#252;ckw&#228;rts aus: Abwurfkante z &#8722;26,0 = 7,65 m vom Sitz, nach 1,4 m Anziehen &#8722;24,6 = 7,12 m.</text>
<text x="30" y="908" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">Beides mitten im Schwenkband 5,8&#8211;9,2 m. Der Haufen liegt hinter dem Wagen, nicht in seiner Ausfahrt.</text>
<text x="30" y="925" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">Rangierpunkt von z &#8722;10,0 auf &#8722;17,5 gezogen: kurzer R&#252;ckweg, weniger Ladungs-Katapult</text>
<text x="30" y="942" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">(Mittel 154 &#8594; 109 km/h, gemessen &#252;ber 16 Ladungen mit festen Zufallssaaten).</text>
<text x="30" y="959" font-family="Segoe UI,Arial" font-size="10.5" fill="#555">Sortenreine Fuhren mit Lagersilo fahren unver&#228;ndert die Gasse an der Westwand zu den Silos.</text>
