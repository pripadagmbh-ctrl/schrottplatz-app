<text x="30.0" y="27.0" font-family="Segoe UI,Arial" font-size="18" fill="#111" text-anchor="start">Rust&#8217;n&#8217;Reibach &#8212; der Kipper l&#228;dt seitlich ab, 15.09.2026 (E-029)</text>
<text x="30.0" y="48.0" font-family="Segoe UI,Arial" font-size="12" fill="#555" text-anchor="start">Er f&#228;hrt jetzt dieselbe Strecke wie die Pritschen und kippt am Abladeplatz &#8212; quer vor dem Sitz.</text>
<text x="30.0" y="64.0" font-family="Segoe UI,Arial" font-size="12" fill="#555" text-anchor="start">Seine eigene Spur mitten im Schwenkband f&#228;llt weg. Sortenreine Fuhren fahren weiter zu den Silos.</text>
<text x="30.0" y="82.0" font-family="Segoe UI,Arial" font-size="10.5" fill="#888" text-anchor="start">Ma&#223;e in Metern &#183; Norden oben &#183; rot gestrichelt = Stand bis heute &#183; gr&#252;n schraffiert = frei geworden</text>
