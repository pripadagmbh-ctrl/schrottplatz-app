<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560"><rect width="1180" height="560" fill="#eef0f3"/><text x="24.0" y="50.0" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#1b2026" text-anchor="start">Die Presse wird kleiner — Vorschlag</text><text x="24.0" y="72.0" font-family="Segoe UI,Arial" font-size="13" font-weight="400" fill="#5b626b" text-anchor="start">Draufsicht auf die Kammer, mit der offenen Spinne als Maß</text><rect x="24" y="96" width="360" height="390" fill="#ffffff" stroke="#c8ccd2" rx="6"/><text x="38.0" y="117.0" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#1b2026" text-anchor="start">VORHER · 5,95 × 4,05 m</text><rect x="90.9" y="219.3" width="226.1" height="161.5" fill="#b9b4ac" fill-opacity="0.18" stroke="#b9b4ac" stroke-width="1.6"/><rect x="102.8" y="231.2" width="202.3" height="137.7" fill="#ffffff" stroke="#b9b4ac" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="204" cy="300" r="57.5" fill="none" stroke="#2c7a66" stroke-width="1.4"/><text x="204.0" y="304.0" font-family="Segoe UI,Arial" font-size="9" font-weight="600" fill="#2c7a66" text-anchor="middle">Spinne 3,38 m</text><text x="204.0" y="219.2" font-family="Segoe UI,Arial" font-size="11" font-weight="600" fill="#1b2026" text-anchor="middle">5,95 × 4,05 m lichte Kammer</text><text x="38.0" y="470.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Grundfläche der Kammer 24,1 m²</text><rect x="406" y="96" width="360" height="390" fill="#ffffff" stroke="#c8ccd2" rx="6"/><text x="420.0" y="117.0" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#1b2026" text-anchor="start">VORSCHLAG · 4,20 × 4,05 m</text><rect x="502.7" y="219.3" width="166.6" height="161.5" fill="#6b4e8c" fill-opacity="0.18" stroke="#6b4e8c" stroke-width="1.6"/><rect x="514.6" y="231.2" width="142.8" height="137.7" fill="#ffffff" stroke="#6b4e8c" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="586" cy="300" r="57.5" fill="none" stroke="#2c7a66" stroke-width="1.4"/><text x="586.0" y="304.0" font-family="Segoe UI,Arial" font-size="9" font-weight="600" fill="#2c7a66" text-anchor="middle">Spinne 3,38 m</text><text x="586.0" y="219.2" font-family="Segoe UI,Arial" font-size="11" font-weight="600" fill="#1b2026" text-anchor="middle">4,20 × 4,05 m lichte Kammer</text><text x="420.0" y="470.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Grundfläche 17,0 m² — 29 % weniger</text><rect x="788" y="96" width="360" height="390" fill="#ffffff" stroke="#c8ccd2" rx="6"/><text x="802.0" y="117.0" font-family="Segoe UI,Arial" font-size="14" font-weight="600" fill="#1b2026" text-anchor="start">GRENZE · 3,98 × 3,98 m</text><rect x="888.4" y="220.4" width="159.1" height="159.1" fill="#a33a24" fill-opacity="0.18" stroke="#a33a24" stroke-width="1.6"/><rect x="900.3" y="232.3" width="135.3" height="135.3" fill="#ffffff" stroke="#a33a24" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="968" cy="300" r="57.5" fill="none" stroke="#2c7a66" stroke-width="1.4"/><text x="968.0" y="304.0" font-family="Segoe UI,Arial" font-size="9" font-weight="600" fill="#2c7a66" text-anchor="middle">Spinne 3,38 m</text><text x="968.0" y="220.3" font-family="Segoe UI,Arial" font-size="11" font-weight="600" fill="#1b2026" text-anchor="middle">3,98 × 3,98 m lichte Kammer</text><text x="802.0" y="470.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Kleiner geht nicht: Spinne + 30 cm je Seite</text><text x="24.0" y="534.0" font-family="Segoe UI,Arial" font-size="12" font-weight="400" fill="#1b2026" text-anchor="start">„Die Presse ist, glaub ich, auch ein bisschen zu groß, die kann verkleinert werden, eher wie so ein Rechteck, wie ein Quader.“ — die Form entscheidet Patrick.</text></svg>