<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1702" width="820" height="1702"><rect width="820" height="1702" fill="#FBFAF7"/><text x="30" y="64" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#1F2326" text-anchor="start">WAS IST STAHLSCHROTT?</text><text x="30" y="102" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6E7377" text-anchor="start">Vorschlag 15.09.2026 · zwei Fraktionen, strenger getrennt</text><rect x="30" y="128" width="760" height="196" rx="12" fill="#F2EFE8" stroke="#D8D4CC" stroke-width="2"/><text x="52" y="172" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1F2326" text-anchor="start">Stahlschrott ist, was massiv ist.</text><text x="52" y="212" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#1F2326" text-anchor="start">Gewicht ÷ (7,85 kg/dm³ × Außenfläche) = Wandstärke.</text><text x="52" y="246" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2326" text-anchor="start">Ab 6 mm: STAHLSCHROTT.   Darunter: MISCHSCHROTT.</text><text x="52" y="280" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#1F2326" text-anchor="start">Dazu: höchstens 10 % Fremdstoff. Sonst Mischschrott.</text><text x="30" y="354" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2326" text-anchor="start">GEMESSEN AM KATALOG</text><line x1="260.9867980769231" y1="370" x2="260.9867980769231" y2="1350" stroke="#B4342A" stroke-width="3"/><text x="260.9867980769231" y="362" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#B4342A" text-anchor="middle">6 mm</text><text x="38" y="392" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Waggon-Drehgestell</text><text x="782" y="392" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">2400 kg · 2,40 × 1,10 × 1,90 m</text><rect x="38" y="402" width="611.5384615384614" height="26" rx="5" fill="#4E6B3A"/><text x="661.5384615384614" y="423" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">16,5 mm</text><text x="38" y="460" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Eisenbahn-Puffer (Paar)</text><text x="782" y="460" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">200 kg · 0,60 × 0,50 × 0,60 m</text><rect x="38" y="470" width="493.15905448717945" height="26" rx="5" fill="#4E6B3A"/><text x="543.1590544871794" y="491" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">13,3 mm</text><text x="38" y="528" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">LKW-Achse</text><text x="782" y="528" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">210 kg · 0,16 × 2,20 m (Ø/Länge)</text><rect x="38" y="538" width="419.04984566831166" height="26" rx="5" fill="#4E6B3A"/><text x="469.04984566831166" y="559" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">11,3 mm</text><text x="38" y="596" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Profilstahl</text><text x="782" y="596" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">60 kg · 0,15 × 0,15 × 1,30 m</text><rect x="38" y="606" width="344.31468531468533" height="26" rx="5" fill="#4E6B3A"/><text x="394.31468531468533" y="627" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">9,3 mm</text><text x="38" y="664" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Doppel-T-Träger</text><text x="782" y="664" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">180 kg · 0,28 × 0,28 × 2,90 m</text><rect x="38" y="674" width="250.28749005928282" height="26" rx="5" fill="#4E6B3A"/><text x="300.28749005928285" y="695" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">6,7 mm</text><text x="38" y="732" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Schienenbündel</text><text x="782" y="732" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">175 kg · 0,35 × 0,35 × 2,20 m</text><rect x="38" y="742" width="249.1751012145749" height="26" rx="5" fill="#4E6B3A"/><text x="299.1751012145749" y="763" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">6,7 mm</text><text x="38" y="800" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Traktor-Frontgewicht</text><text x="782" y="800" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">160 kg · 0,50 × 0,50 × 1,40 m</text><rect x="38" y="810" width="229.54312354312356" height="26" rx="5" fill="#4E6B3A"/><text x="279.54312354312356" y="831" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#4E6B3A" text-anchor="start">6,2 mm</text><line x1="30" y1="862" x2="790" y2="862" stroke="#B4342A" stroke-width="2" stroke-dasharray="7 5"/><text x="790" y="882" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#B4342A" text-anchor="end">ab hier: MISCHSCHROTT</text><text x="38" y="900" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Palettenregal-Traversen (Bund)</text><text x="782" y="900" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">105 kg · 0,25 × 0,25 × 2,20 m</text><rect x="38" y="910" width="213.80831265508684" height="26" rx="5" fill="#9A948B"/><text x="263.80831265508687" y="931" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">5,8 mm</text><text x="38" y="968" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">LKW-Felge</text><text x="782" y="968" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">46 kg · 0,28 × 0,32 m (Ø/Länge)</text><rect x="38" y="978" width="206.3131575771061" height="26" rx="5" fill="#9A948B"/><text x="256.3131575771061" y="999" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">5,6 mm</text><text x="38" y="1036" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Baggerlöffel</text><text x="782" y="1036" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">205 kg · 1,10 × 0,85 × 0,95 m</text><rect x="38" y="1046" width="174.08735770955502" height="26" rx="5" fill="#9A948B"/><text x="224.08735770955502" y="1067" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">4,7 mm</text><text x="38" y="1104" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Seecontainer 20 Fuß</text><text x="782" y="1104" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">2200 kg · 2,40 × 2,60 × 4,80 m</text><rect x="38" y="1114" width="172.21427299552298" height="26" rx="5" fill="#9A948B"/><text x="222.21427299552298" y="1135" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">4,6 mm</text><text x="38" y="1172" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Blechtafel</text><text x="782" y="1172" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">220 kg · 1,90 × 0,08 × 1,50 m</text><rect x="38" y="1182" width="166.8084437983541" height="26" rx="5" fill="#9A948B"/><text x="216.8084437983541" y="1203" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">4,5 mm</text><text x="38" y="1240" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Gitterbox</text><text x="782" y="1240" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">120 kg · 1,20 × 0,80 × 0,80 m</text><rect x="38" y="1250" width="110.96078725961539" height="26" rx="5" fill="#9A948B"/><text x="160.9607872596154" y="1271" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">3,0 mm</text><text x="38" y="1308" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1F2326" text-anchor="start">Elektroherd</text><text x="782" y="1308" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6E7377" text-anchor="end">30 kg · 0,65 × 0,90 × 0,60 m</text><rect x="38" y="1318" width="46.87452399086062" height="26" rx="5" fill="#9A948B"/><text x="96.87452399086061" y="1339" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#9A948B" text-anchor="start">1,3 mm</text><rect x="30" y="1382" width="760" height="150" rx="12" fill="#FFF4EE" stroke="#B4342A" stroke-width="2"/><text x="52" y="1424" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#B4342A" text-anchor="start">UND DIE GITTERBOX?</text><text x="52" y="1460" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#1F2326" text-anchor="start">120 kg auf 5,12 m² Außenfläche = 3,0 mm.</text><text x="52" y="1494" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#1F2326" text-anchor="start">Halb so dick wie die Schwelle —</text><text x="492" y="1494" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#B4342A" text-anchor="start">MISCHSCHROTT.</text><text x="52" y="1524" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#6E7377" text-anchor="start">Ein Rahmen mit Luft dazwischen — genau das meint „gemischt“.</text><line x1="30" y1="1558" x2="790" y2="1558" stroke="#D8D4CC" stroke-width="2"/><text x="30" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2326" text-anchor="start">Heute Stahlschrott: 156 von 308 Katalogstücken.</text><text x="30" y="1622" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#1F2326" text-anchor="start">Nach dieser Regel: 56.</text><text x="30" y="1652" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#6E7377" text-anchor="start">Schwelle 6 mm = Sortenliste E1/E3 gegen Blechschrott. Stahl 7850 kg/m³.</text><text x="30" y="1678" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#6E7377" text-anchor="start">Erzeugt aus dem Katalog: tools/stahlschrott-blatt.ts · E-042</text></svg>
