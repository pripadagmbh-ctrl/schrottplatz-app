<text x="34" y="3276" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">1. Anvisieren: die Zeile oben nennt Name,</text>
<text x="34" y="3312" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">    Fraktion und Hauptmaterial. Der einzige</text>
<text x="34" y="3348" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">    Ort im Spiel, an dem die Fraktion steht.</text>
<text x="34" y="3384" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">2. Ampel am Muldenschild: grün = darf hinein.</text>
<text x="34" y="3420" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">3. Sonst nichts. Kein Schild am Platz, kein</text>
<text x="34" y="3456" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#1F2326" text-anchor="start">    Menü, kein Tutorialschritt sagt es.</text>
<text x="34" y="3522" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6E7377" text-anchor="start">Gemessen am 15.09.2026 aus dem Quelltext des</text>
<text x="34" y="3550" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6E7377" text-anchor="start">Arbeitsstands. ΔE2000 nach CIE 142:2001,</text>
<text x="34" y="3578" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6E7377" text-anchor="start">Werkzeug gegen Sharma/Wu/Dalal (2005) geprüft.</text>
