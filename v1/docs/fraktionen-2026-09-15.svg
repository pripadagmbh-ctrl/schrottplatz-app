<text x="52" y="522" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">#6e5a4e</text>
<text x="52" y="554" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">250 €/t</text>
<rect x="420" y="442" width="366" height="132" rx="10" fill="#5f5a52" stroke="#D8D4CC" stroke-width="2"/>
<text x="438" y="488" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">MISCHSCHROTT</text>
<text x="438" y="522" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">#5f5a52</text>
<text x="438" y="554" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">160 €/t</text>
<text x="34" y="608" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2326" text-anchor="start">Farbabstand der beiden: ΔE2000 = 7,6</text>
<text x="34" y="640" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6E7377" text-anchor="start">(unter 2 gilt als nicht unterscheidbar, unter 10 als</text>
<text x="34" y="668" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6E7377" text-anchor="start">gleiche Farbe mit anderem Ton). Bei Abendlicht: 4,2.</text>
<rect x="34" y="712" width="752" height="250" rx="8" fill="#FBEFEC" stroke="#B4342A" stroke-width="2"/>
<text x="58" y="760" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700" fill="#B4342A" text-anchor="start">ABER: DIE TEILE TRAGEN SIE NICHT</text>
<text x="58" y="802" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#1F2326" text-anchor="start">16 von 271 Teilen tragen die</text>
<text x="58" y="840" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#1F2326" text-anchor="start">Fraktionsfarbe. Alle anderen sind nach</text>
<text x="58" y="878" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#1F2326" text-anchor="start">ZWECK gefärbt: weiß = Haushaltsgerät,</text>
<text x="58" y="916" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#1F2326" text-anchor="start">blau = Container, grün = Landmaschine.</text>
<text x="34" y="1006" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F2326" text-anchor="start">GEMESSEN: SO NAH LIEGEN SIE</text>
<text x="34" y="1042" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6E7377" text-anchor="start">Flächengewichtete Mittelfarbe der gebauten Teile.</text>
