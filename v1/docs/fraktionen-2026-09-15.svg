<svg xmlns="http://www.w3.org/2000/svg" width="820" height="3618" viewBox="0 0 820 3618">
<rect width="820" height="3618" fill="#FBFAF7"/>
<text x="34" y="76" font-family="Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#1F2326" text-anchor="start">WAS GEHÖRT WOHIN</text>
<text x="34" y="110" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6E7377" text-anchor="start">Rust'n'Reibach v1 · Stand 15.09.2026</text>
<text x="34" y="140" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6E7377" text-anchor="start">Farben und Preise aus dem Quelltext gelesen.</text>
<rect x="34" y="186" width="752" height="178" rx="8" fill="#F0EDE6" stroke="#D8D4CC" stroke-width="2"/>
<text x="58" y="236" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1F2326" text-anchor="start">DIE REGEL</text>
<text x="58" y="280" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#1F2326" text-anchor="start">Sortenrein ist ein Teil ab 95 %</text>
<text x="58" y="320" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#1F2326" text-anchor="start">eines Stoffes. Alles darunter ist</text>
<text x="58" y="360" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#B4342A" text-anchor="start">MISCHSCHROTT — auch bei 94 % Stahl.</text>
<text x="34" y="404" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F2326" text-anchor="start">STAHLSCHROTT ODER MISCHSCHROTT?</text>
<rect x="34" y="442" width="366" height="132" rx="10" fill="#6e5a4e" stroke="#D8D4CC" stroke-width="2"/>
