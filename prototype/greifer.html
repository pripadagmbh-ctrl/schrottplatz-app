<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mehrschalengreifer — Vorschau</title>
    <style>
      /*
       * Vorschau des exportierten Greifers.
       *
       * Sie laedt bewusst die GLB-DATEI und nicht das Modell aus dem Quelltext.
       * Nur so sieht man, was tatsaechlich in einer Engine ankommt — Hierarchie,
       * Pivots, Materialien und Animationen so, wie sie exportiert wurden.
       */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dde2; }
      canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
      #leiste {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        padding: 12px; background: rgba(24, 28, 32, 0.88);
        font: 13px/1 "Segoe UI", system-ui, sans-serif;
      }
      button {
        appearance: none; border: 1px solid #566; border-radius: 5px;
        background: #2b3238; color: #e6eaee; padding: 9px 14px; cursor: pointer;
        font: inherit;
      }
      button:hover { background: #3a444c; }
      button.an { background: #6db33f; border-color: #6db33f; color: #10160f; }
      #kopf {
        position: fixed; left: 12px; top: 12px;
        font: 13px/1.5 "Consolas", monospace; color: #2a3036;
        background: rgba(255, 255, 255, 0.78); border-radius: 6px; padding: 8px 12px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="kopf">lade …</div>
    <div id="leiste"></div>
    <script type="module" src="/src/greifer/vorschau.ts"></script>
  </body>
</html>
