<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1e2124" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%234fbf3f%27/%3E%3Crect x=%277%27 y=%2718%27 width=%2718%27 height=%277%27 fill=%27%231e2124%27/%3E%3Crect x=%2715%27 y=%276%27 width=%274%27 height=%2714%27 fill=%27%23f2b632%27/%3E%3C/svg%3E" />
    <title>Bagerana</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2124; color: #eef0ec; font-family: Inter, system-ui, sans-serif; }
      body { height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* iOS-Safari zoomt bei Doppeltipp/Pinch die Seite — nur touch-action:none auf JEDEM Element verhindert das (iPad-Test 08.09.) */
      body * { touch-action: none; -webkit-touch-callout: none; }
      #scene { display: block; width: 100%; height: 100%; touch-action: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #1e2124; font-size: 18px; }
      #debug-box[hidden] { display: none; } /* Autor-CSS „display: grid" würde das hidden-Attribut sonst überstimmen (iPhone-Test 08.09.) */
      #debug-box { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); z-index: 10; display: grid; gap: 6px; justify-items: start; }
      #debug-overlay { margin: 0; padding: 6px 8px; font: 12px/1.35 ui-monospace, Consolas, monospace; color: #eef0ec; background: rgba(20,22,24,.85); border-radius: 6px; pointer-events: none; }
      #debug-dump { min-height: 44px; padding: 0 14px; font: 600 14px Inter, system-ui, sans-serif; color: #1e2124; background: #f2b632; border: 0; border-radius: 6px; touch-action: manipulation; }
      /* Touch-Layer (Briefing Kap. 5.2): root fängt nichts, nur die Kinder. Zonen = 40 % Breite, vom Boden bis unter die Knopfleiste. */
      #touch-layer { position: fixed; inset: 0; z-index: 5; pointer-events: none;
        --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px); }
      /* Stick-Zonen: 40 % Breite, vom Boden bis unter die Knopfleiste (Knöpfe liegen darüber). Kamera nur im Mittelstreifen. */
      #touch-layer .zone { position: absolute; bottom: 0; width: 40%; top: calc(var(--sat) + 72px); pointer-events: auto; touch-action: none; }
      #touch-layer .zone-left { left: 0; } #touch-layer .zone-right { right: 0; }
      #touch-layer .zone-cam { left: 40%; width: 20%; top: calc(var(--sat) + 72px); }
      #touch-layer .tbtn { z-index: 2; }
      #touch-layer .stick { position: absolute; width: var(--stick); height: var(--stick); border-radius: 50%; border: 2px solid rgba(238,240,236,.55); background: rgba(20,22,24,.35); pointer-events: none; }
      #touch-layer .stick .knob { position: absolute; left: calc(50% - var(--knob) / 2); top: calc(50% - var(--knob) / 2); width: var(--knob); height: var(--knob); border-radius: 50%; background: rgba(242,182,50,.9); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
      #touch-layer #stick-right { border-color: rgba(79,191,63,.7); }
      #touch-layer .tbtn { position: absolute; pointer-events: auto; touch-action: none; min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; color: #eef0ec; background: rgba(20,22,24,.7); font: 600 14px Inter, system-ui, sans-serif; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
      #touch-layer .tbtn.active { background: #f2b632; color: #1e2124; }
      #touch-layer #btn-drive { width: var(--drive); height: var(--drive); left: calc(var(--sal) + 20px); bottom: calc(var(--sab) + 57%); font-size: 11px; }
      #touch-layer .rot { width: var(--rot); height: var(--rot); bottom: calc(var(--sab) + 57%); font-size: 22px; }
      #touch-layer .zone-left::before, #touch-layer .zone-right::before { content: ""; position: absolute; inset: 8px; border-radius: 16px; border: 1px dashed rgba(238,240,236,.12); pointer-events: none; }
      #touch-layer #btn-rot-l { right: calc(var(--sar) + 20px + var(--rot) + 12px); }
      #touch-layer #btn-rot-r { right: calc(var(--sar) + 20px); }
      #touch-layer #btn-camera { width: 48px; height: 48px; right: calc(var(--sar) + 12px); top: calc(var(--sat) + 12px); font-size: 24px; }
      #touch-layer .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 10px); padding: 4px 10px; font-size: 12px; color: rgba(238,240,236,.75); background: rgba(20,22,24,.5); border-radius: 6px; white-space: nowrap; }
      #touch-layer.compact .hint { display: none; }
      #touch-layer.compact #btn-drive, #touch-layer.compact .rot { bottom: calc(var(--sab) + 60%); }
      /* Flache Querformate (iPhone mini quer: 375 px hoch): Debug-Box kompakter, damit sie nicht in FAHREN ragt */
      @media (max-height: 500px) {
        #debug-overlay { font-size: 10px; line-height: 1.2; padding: 4px 6px; }
        #debug-box { grid-auto-flow: column; align-items: end; top: auto; bottom: max(8px, env(safe-area-inset-bottom)); } /* unten links, damit FAHREN oben Platz hat */
        #debug-dump { min-height: 36px; font-size: 12px; padding: 0 10px; }
        /* Von OBEN verankern: iOS-Safari zählt den unteren Rand hinter der Werkzeugleiste, Prozent-vom-Boden landet
           ~70 px zu hoch und ↻ lag auf ⌖ (iPhone-Screenshot 08.09.). Unter der ⌖-Reihe (12 + 48 px) ist die Kante eindeutig. */
        #touch-layer #btn-drive, #touch-layer .rot { bottom: auto; top: calc(var(--sat) + 72px); }
        #touch-layer #btn-camera { top: calc(var(--sat) + 8px); }
        /* Chip nach oben: unten säße er auf dem Bagger */
        #grip-chip { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 68px); height: 36px; font-size: 13px; border-radius: 18px; }
      }
      /* Griff-Info-Chip (Kap. 14.1): unten Mitte, 44 px, über der Touch-Hilfe */
      #grip-chip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); z-index: 6; height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 8px; font: 600 15px Inter, system-ui, sans-serif; color: #eef0ec; background: rgba(20,22,24,.85); border-radius: 22px; border-left: 6px solid #eef0ec; white-space: nowrap; pointer-events: none; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
      #grip-chip[data-state="ok"] { border-left-color: #4fbf3f; } #grip-chip[data-state="tolerated"] { border-left-color: #f2b632; } #grip-chip[data-state="wrong"] { border-left-color: #e0483a; }
      @media (max-width: 700px) { #grip-chip { font-size: 13px; padding: 0 12px; } }
      /* HUD M4a: Konto + Punkte oben Mitte, Toasts darunter, Verkaufsliste */
      #touch-layer .zone-cam { top: calc(var(--sat) + 72px); }
      .hud-bar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 7; display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(20,22,24,.85); color: #eef0ec; font: 600 15px Inter, system-ui, sans-serif; white-space: nowrap; }
      .hud-points { color: #f2b632; }
      .hud-sell { min-height: 36px; padding: 0 12px; border: 0; border-radius: 14px; background: #4fbf3f; color: #1e2124; font: 600 13px Inter, system-ui, sans-serif; touch-action: manipulation; }
      .hud-toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 7; display: grid; gap: 4px; justify-items: center; pointer-events: none; }
      .toast { padding: 4px 12px; border-radius: 12px; background: rgba(20,22,24,.8); color: #eef0ec; font: 600 13px Inter, system-ui, sans-serif; transition: opacity .3s; white-space: nowrap; }
      .toast.good { background: rgba(79,191,63,.9); color: #1e2124; } .toast.bad { background: rgba(224,72,58,.9); } .toast.out { opacity: 0; }
      .sell-panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 12; width: min(520px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; background: rgba(20,22,24,.95); color: #eef0ec; border-radius: 12px; padding: 12px; font: 14px Inter, system-ui, sans-serif; }
      .sell-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
      .sell-close { min-width: 44px; min-height: 44px; border: 0; border-radius: 8px; background: rgba(238,240,236,.1); color: #eef0ec; font-size: 18px; }
      .sell-row { display: grid; grid-template-columns: 1.4fr .8fr .6fr .8fr auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(238,240,236,.1); }
      .sell-row .ok { color: #4fbf3f; } .sell-row .warn { color: #f2b632; } .sell-row .bad { color: #e0483a; }
      .sell-row button { min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: #f2b632; color: #1e2124; font-weight: 600; }
      .sell-row button[disabled] { opacity: .35; }
      @media (max-height: 500px) { .hud-bar { height: 30px; font-size: 13px; gap: 10px; } #grip-chip { top: calc(env(safe-area-inset-top, 0px) + 44px + 30px); } }
      /* M4b: Tag-Anzeige, „Tag beenden", Auftragszeile, Bottom-Sheet (Morgen/Feierabend), Einweisungs-Banner */
      .hud-day { color: rgba(238,240,236,.75); font-weight: 600; }
      .hud-end { min-height: 36px; padding: 0 12px; border: 0; border-radius: 14px; background: rgba(238,240,236,.15); color: #eef0ec; font: 600 13px Inter, system-ui, sans-serif; touch-action: manipulation; }
      .hud-end.ready { background: #4fbf3f; color: #1e2124; }
      .hud-missions { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 6; display: flex; gap: 8px; max-width: calc(100vw - 160px); overflow: hidden; pointer-events: none; }
      .hud-missions span { padding: 3px 10px; border-radius: 10px; background: rgba(20,22,24,.7); color: #eef0ec; font: 600 12px Inter, system-ui, sans-serif; white-space: nowrap; }
      .hud-missions span.done { background: rgba(79,191,63,.85); color: #1e2124; }
      .hud-missions[hidden] { display: none; }
      /* Toasts nach unten ueber den Griff-Chip: oben sitzen jetzt Auftragszeile und Einweisung */
      .hud-toasts { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
      .sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; background: rgba(20,22,24,.45); }
      .sheet[hidden] { display: none; }
      .sheet-body { width: min(560px, 100vw); max-height: min(80vh, 100dvh - 24px); overflow: auto; box-sizing: border-box; padding: 16px 20px calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(20,22,24,.97); color: #eef0ec; border-radius: 16px 16px 0 0; font: 15px/1.4 Inter, system-ui, sans-serif; touch-action: pan-y; }
      .sheet-body * { touch-action: pan-y; }
      .sheet-body h2 { margin: 0 0 6px; font-size: 20px; } .sheet-body h3 { margin: 12px 0 4px; font-size: 14px; color: rgba(238,240,236,.75); text-transform: uppercase; letter-spacing: .04em; }
      .sheet-body ul { margin: 0; padding-left: 18px; } .sheet-body li { margin: 4px 0; } .sheet-body .bonus { color: #f2b632; white-space: nowrap; }
      .sheet-body .muted { color: rgba(238,240,236,.65); } .sheet-body .ok { color: #4fbf3f; } .sheet-body .bad { color: #e0483a; }
      .sheet-body .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid rgba(238,240,236,.1); }
      .sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .sheet-actions button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: rgba(238,240,236,.12); color: #eef0ec; font: 600 15px Inter, system-ui, sans-serif; touch-action: manipulation; }
      .sheet-actions button.primary { background: #f2b632; color: #1e2124; flex: 1 1 auto; }
      /* Oben unter der HUD-Leiste, NICHT unten: unten liegen die Stick-Zonen, und der Ueberspringen-Knopf fing dort Daumen ab (E2E Hochformat) */
      .tut { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 6; width: min(560px, calc(100vw - 150px)); box-sizing: border-box; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; background: rgba(20,22,24,.88); color: #eef0ec; border-radius: 12px; border-left: 6px solid #f2b632; font: 14px/1.35 Inter, system-ui, sans-serif; pointer-events: none; }
      .tut[hidden] { display: none; }
      .tut-title { font-weight: 600; font-size: 12px; color: #f2b632; grid-column: 1; } .tut-text { grid-column: 1; }
      .tut-skip { grid-column: 2; grid-row: 1 / span 2; align-self: center; min-height: 44px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(238,240,236,.12); color: #eef0ec; font: 600 12px Inter, system-ui, sans-serif; pointer-events: auto; touch-action: manipulation; }
      @media (max-height: 500px) { .tut { top: calc(env(safe-area-inset-top, 0px) + 44px + 30px + 40px); width: min(460px, 44vw); font-size: 12px; padding: 6px 10px; } .hud-missions { top: calc(env(safe-area-inset-top, 0px) + 40px); } .hud-end, .hud-sell { min-height: 26px; font-size: 12px; } }
      /* Menue ☰ links neben ⌖ */
      .menu-btn { position: fixed; z-index: 6; width: 48px; height: 48px; right: calc(env(safe-area-inset-right, 0px) + 12px + 48px + 10px); top: calc(env(safe-area-inset-top, 0px) + 12px); border: 0; border-radius: 50%; color: #eef0ec; background: rgba(20,22,24,.7); font-size: 22px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      .menu-panel { display: grid; gap: 8px; }
      .menu-item { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: rgba(238,240,236,.12); color: #eef0ec; font: 600 15px Inter, system-ui, sans-serif; text-align: left; touch-action: manipulation; }
      .menu-item.danger { background: #e0483a; color: #eef0ec; }
      @media (max-height: 500px) { .menu-btn { top: calc(env(safe-area-inset-top, 0px) + 8px); } }
      .fatal { padding: 24px; max-width: 900px; margin: 0 auto; }
      .fatal h1 { color: #e0483a; font-size: 20px; }
      .fatal pre { white-space: pre-wrap; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="boot">Lädt …</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
